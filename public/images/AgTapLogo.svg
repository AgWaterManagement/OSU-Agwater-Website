<svg width="720" height="220" viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (transparent by default) -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- Left emblem group -->
  <g transform="translate(110,110)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="80" fill="white" stroke="#1F5F2C" stroke-width="4"/>

    <!-- Green fields -->
    <path d="M -70 30
             Q 0 0 70 30
             L 70 50
             Q 0 20 -70 50 Z"
          fill="#3FA34D"/>
    <path d="M -70 50
             Q 0 20 70 50
             L 70 60
             Q 0 30 -70 60 Z"
          fill="#2E7C3F"/>

    <!-- Blue water droplet -->
    <path d="M 0 -55
             C -18 -25 -30 -5 -30 15
             C -30 35 -15 50 0 50
             C 15 50 30 35 30 15
             C 30 -5 18 -25 0 -55 Z"
          fill="#1E88E5"/>

    <!-- Small hex icon (orange/green/yellow) -->
    <g transform="translate(45,-45) scale(0.6)">
      <polygon points="0,-18 15,-9 15,9 0,18 -15,9 -15,-9"
               fill="#F57C00"/>
      <polygon points="0,-12 9,-6 9,6 0,12 -9,6 -9,-6"
               fill="#3FA34D"/>
      <polygon points="0,-6 5,-3 5,3 0,6 -5,3 -5,-3"
               fill="#FBC02D"/>
    </g>
  </g>

  <!-- Text group -->
  <g transform="translate(220,80)" fill="#1F5F2C" font-family="Segoe UI, Arial, sans-serif">
    <!-- Program name -->
    <text x="0" y="0" font-size="26" font-weight="700">
      Agricultural Water Technical
    </text>
    <text x="0" y="34" font-size="26" font-weight="700">
      Advisory Program
    </text>

    <!-- URL -->
    <text x="0" y="72" font-size="20" font-weight="600">
      agwater.oregonstate.edu
    </text>
  </g>
</svg>
